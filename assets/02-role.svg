<svg width="560" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="DM Sans, Inter, system-ui, sans-serif">
  <style>
    .eyebrow { font-size: 10px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 700; }
    .head    { font-size: 19px;   font-weight: 700; fill: #0a0a0a; letter-spacing: -0.3px; }
    .subhead { font-size: 11px;   fill: #6b6b6b; }
    .modelbl { font-size: 8.5px;  letter-spacing: 0.18em; fill: #8a8a8a; font-weight: 700; }
    .role    { font-size: 12.5px; font-weight: 700; fill: #0a0a0a; }
    .roled   { font-size: 10px;   fill: #6b6b6b; }
    .cardeye { font-size: 8px;    letter-spacing: 0.18em; fill: #8a8a8a; font-weight: 700; }
    .cardttl { font-size: 15px;   font-weight: 700; fill: #0a0a0a; }
    .close   { font-size: 12px;   font-weight: 700; fill: #0a0a0a; }
    .closed  { font-size: 10.5px; fill: #6b6b6b; }
  </style>

  <rect x="0" y="0" width="560" height="500" rx="18" fill="#f2f2ef"/>

  <!-- HEADER -->
  <text x="280" y="46" text-anchor="middle" class="eyebrow">BOTH SIDES OF THE BUILDER</text>
  <text x="280" y="86" text-anchor="middle" class="head">One artifact. Two ways in.</text>
  <text x="280" y="108" text-anchor="middle" class="subhead">Neither audience is asked to become the other.</text>

  <!-- mode labels above each column -->
  <text x="101" y="150" text-anchor="middle" class="modelbl">SPECIFICATIONS</text>
  <text x="280" y="150" text-anchor="middle" class="modelbl">THE ARTIFACT</text>
  <text x="459" y="150" text-anchor="middle" class="modelbl">ADVANCED</text>

  <!-- ============ LEFT · conversation pane ============ -->
  <g>
    <rect x="26" y="164" width="150" height="176" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="38" y="182" width="88" height="24" rx="8" fill="#ededed"/>
    <rect x="62" y="214" width="88" height="24" rx="8" fill="#0a0a0a"/>
    <rect x="38" y="246" width="100" height="32" rx="8" fill="#ededed"/>
    <rect x="38" y="286" width="52" height="18" rx="8" fill="#ededed"/>
    <rect x="38" y="312" width="126" height="18" rx="5" fill="none" stroke="#0a0a0a" stroke-width="0.8" stroke-dasharray="2 2"/>
  </g>

  <!-- arrow left → card -->
  <g stroke="#0a0a0a" stroke-width="1.2" fill="#0a0a0a">
    <line x1="180" y1="252" x2="194" y2="252" stroke-dasharray="3 3"/>
    <polygon points="200,252 192,247 192,257" stroke="none"/>
  </g>

  <!-- ============ CENTRE · the artifact ============ -->
  <g>
    <rect x="200" y="164" width="160" height="176" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.8"/>
    <text x="280" y="196" text-anchor="middle" class="cardeye">WORKFLOW</text>
    <text x="280" y="222" text-anchor="middle" class="cardttl">Supplier</text>
    <text x="280" y="240" text-anchor="middle" class="cardttl">Onboarding</text>
    <line x1="222" y1="256" x2="338" y2="256" stroke="#ededed" stroke-width="1"/>
    <rect x="222" y="268" width="116" height="3" rx="1.5" fill="#c0c0c0"/>
    <rect x="222" y="278" width="96"  height="3" rx="1.5" fill="#c0c0c0"/>
    <rect x="222" y="288" width="108" height="3" rx="1.5" fill="#c0c0c0"/>
    <rect x="222" y="298" width="76"  height="3" rx="1.5" fill="#c0c0c0"/>
    <rect x="222" y="314" width="66" height="16" rx="8" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
    <text x="255" y="325" text-anchor="middle" font-size="8" font-weight="700" fill="#0a0a0a">v1.2 · DRAFT</text>
  </g>

  <!-- arrow right → card -->
  <g stroke="#0a0a0a" stroke-width="1.2" fill="#0a0a0a">
    <line x1="380" y1="252" x2="366" y2="252" stroke-dasharray="3 3"/>
    <polygon points="360,252 368,247 368,257" stroke="none"/>
  </g>

  <!-- ============ RIGHT · node canvas ============ -->
  <g>
    <rect x="384" y="164" width="150" height="176" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
    <!-- dotted grid -->
    <g fill="#dedede">
      <circle cx="400" cy="180" r="0.9"/><circle cx="424" cy="180" r="0.9"/><circle cx="448" cy="180" r="0.9"/><circle cx="472" cy="180" r="0.9"/><circle cx="496" cy="180" r="0.9"/><circle cx="520" cy="180" r="0.9"/>
      <circle cx="400" cy="204" r="0.9"/><circle cx="424" cy="204" r="0.9"/><circle cx="448" cy="204" r="0.9"/><circle cx="472" cy="204" r="0.9"/><circle cx="496" cy="204" r="0.9"/><circle cx="520" cy="204" r="0.9"/>
      <circle cx="400" cy="228" r="0.9"/><circle cx="424" cy="228" r="0.9"/><circle cx="448" cy="228" r="0.9"/><circle cx="472" cy="228" r="0.9"/><circle cx="496" cy="228" r="0.9"/><circle cx="520" cy="228" r="0.9"/>
      <circle cx="400" cy="252" r="0.9"/><circle cx="424" cy="252" r="0.9"/><circle cx="448" cy="252" r="0.9"/><circle cx="472" cy="252" r="0.9"/><circle cx="496" cy="252" r="0.9"/><circle cx="520" cy="252" r="0.9"/>
      <circle cx="400" cy="276" r="0.9"/><circle cx="424" cy="276" r="0.9"/><circle cx="448" cy="276" r="0.9"/><circle cx="472" cy="276" r="0.9"/><circle cx="496" cy="276" r="0.9"/><circle cx="520" cy="276" r="0.9"/>
      <circle cx="400" cy="300" r="0.9"/><circle cx="424" cy="300" r="0.9"/><circle cx="448" cy="300" r="0.9"/><circle cx="472" cy="300" r="0.9"/><circle cx="496" cy="300" r="0.9"/><circle cx="520" cy="300" r="0.9"/>
      <circle cx="400" cy="324" r="0.9"/><circle cx="424" cy="324" r="0.9"/><circle cx="448" cy="324" r="0.9"/><circle cx="472" cy="324" r="0.9"/><circle cx="496" cy="324" r="0.9"/><circle cx="520" cy="324" r="0.9"/>
    </g>
    <!-- wires -->
    <g stroke="#0a0a0a" stroke-width="0.9" fill="none">
      <path d="M 442 195 H 452 V 232"/>
      <path d="M 489 224 V 232"/>
      <path d="M 452 264 V 274 H 419 V 282"/>
      <path d="M 484 264 V 286 H 501 V 296"/>
    </g>
    <!-- nodes -->
    <rect x="396" y="184" width="46" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="402" y="190" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
    <rect x="402" y="197" width="26" height="2" rx="1" fill="#c0c0c0"/>

    <rect x="466" y="202" width="46" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="472" y="208" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
    <rect x="472" y="215" width="26" height="2" rx="1" fill="#c0c0c0"/>

    <rect x="430" y="232" width="72" height="32" rx="5" fill="#0a0a0a"/>
    <rect x="438" y="240" width="14" height="3" rx="1.5" fill="#ffffff"/>
    <rect x="438" y="248" width="44" height="2" rx="1" fill="#8a8a8a"/>
    <rect x="438" y="254" width="34" height="2" rx="1" fill="#8a8a8a"/>

    <rect x="396" y="282" width="46" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="402" y="288" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
    <rect x="402" y="295" width="26" height="2" rx="1" fill="#c0c0c0"/>

    <rect x="478" y="296" width="46" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="484" y="302" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
    <rect x="484" y="309" width="26" height="2" rx="1" fill="#c0c0c0"/>
  </g>

  <!-- ============ ROLE LABELS ============ -->
  <text x="101" y="372" text-anchor="middle" class="role">Domain Author</text>
  <text x="101" y="390" text-anchor="middle" class="roled">speaks procurement</text>
  <text x="101" y="404" text-anchor="middle" class="roled">authors in conversation</text>

  <text x="459" y="372" text-anchor="middle" class="role">Engineer</text>
  <text x="459" y="390" text-anchor="middle" class="roled">speaks platform</text>
  <text x="459" y="404" text-anchor="middle" class="roled">refines on the canvas</text>

  <!-- ============ CLOSE ============ -->
  <line x1="60" y1="436" x2="500" y2="436" stroke="#ededed" stroke-width="1"/>
  <text x="280" y="462" text-anchor="middle" class="close">Same artifact. Two cognitive modes.</text>
  <text x="280" y="480" text-anchor="middle" class="closed">One shared data model underneath both.</text>
</svg>
