<svg width="920" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 920 320"><rect width="920" height="320" fill="#f7f7f5" rx="18"/><text x="460" y="50" fill="#6b6b6b" font-size="11" font-weight="600" letter-spacing="2.5" text-anchor="middle">WHAT THE RESEARCH FOUND</text><text y="80" fill="#0a0a0a" font-size="92" font-weight="900" letter-spacing="-3" transform="translate(80 108)">11/12</text><path stroke="#0a0a0a" d="M80 212h320"/><text y="134" fill="#0a0a0a" font-size="14" font-weight="700" transform="translate(80 108)">procurement experts</text><text y="152" fill="#6b6b6b" font-size="12" transform="translate(80 108)">gave up before publishing</text><text y="170" fill="#6b6b6b" font-size="12" transform="translate(80 108)">in the legacy Qi Studio.</text><path stroke="#0a0a0a" stroke-dasharray="2 4" stroke-width=".5" d="M460 108v180"/><text y="80" fill="#0a0a0a" font-size="92" font-weight="900" letter-spacing="-3" transform="translate(500 108)">70%</text><path stroke="#0a0a0a" d="M500 212h320"/><text y="134" fill="#0a0a0a" font-size="14" font-weight="700" transform="translate(500 108)">of engineering build time</text><text y="152" fill="#6b6b6b" font-size="12" transform="translate(500 108)">was translation — not</text><text y="170" fill="#6b6b6b" font-size="12" transform="translate(500 108)">prompts, tools, or testing.</text></svg>