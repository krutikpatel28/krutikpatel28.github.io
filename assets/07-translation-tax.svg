<svg width="1080" height="830" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" font-family="Inter, system-ui, sans-serif">
  <style>
    .eyebrow { font-size: 11px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 600; }
    .title   { font-size: 34px;   font-weight: 800; fill: #0a0a0a; letter-spacing: -0.6px; }
    .sub     { font-size: 14px;   fill: #6b6b6b; }
    .band    { font-size: 10px;   letter-spacing: 0.24em; fill: #6b6b6b; font-weight: 600; }
    .stat    { font-size: 22px;   font-weight: 700; fill: #0a0a0a; letter-spacing: -0.2px; }
    .nlabel  { font-size: 10.5px; font-weight: 700; fill: #0a0a0a; }
    .ntime   { font-size: 8.5px;  fill: #6b6b6b; font-variant-numeric: tabular-nums; }
    .dlabel  { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .dtime   { font-size: 8.5px;  fill: #c0c0c0; font-variant-numeric: tabular-nums; }
    .dbrow   { font-size: 7.5px;  letter-spacing: 0.2em; fill: #c0c0c0; font-weight: 700; }
    .chip    { font-size: 7.5px;  letter-spacing: 0.08em; fill: #c0c0c0; font-weight: 600; }
    .note    { font-size: 9.5px;  fill: #6b6b6b; font-style: italic; }
    .foot    { font-size: 11px;   fill: #6b6b6b; font-style: italic; }
    .mega    { font-size: 58px;   font-weight: 900; fill: #0a0a0a; letter-spacing: -2.5px; }
    .megasub { font-size: 11.5px; font-weight: 600; fill: #0a0a0a; }
  </style>

  <rect x="0" y="0" width="1080" height="830" rx="18" fill="#f2f2ef"/>

  <!-- HEADER -->
  <text x="540" y="58"  text-anchor="middle" class="eyebrow">THE TRANSLATION TAX</text>
  <text x="540" y="106" text-anchor="middle" class="title">The hidden cost of separate audiences.</text>
  <text x="540" y="136" text-anchor="middle" class="sub">Domain knowledge and platform knowledge lived in different people.</text>

  <!-- BEFORE BAND -->
  <text x="540" y="196" text-anchor="middle" class="band">BEFORE</text>
  <text x="540" y="228" text-anchor="middle" class="stat">~3 weeks per workflow</text>

  <!-- rail: node1 center 144 to node7 center 936 -->
  <line x1="144" y1="304" x2="936" y2="304" stroke="#0a0a0a" stroke-width="1.2"/>

  <!-- chevrons at gap centers 210 342 474 606 738 870 -->
  <g fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="207,299 212,304 207,309"/>
    <polyline points="339,299 344,304 339,309"/>
    <polyline points="471,299 476,304 471,309"/>
    <polyline points="603,299 608,304 603,309"/>
    <polyline points="735,299 740,304 735,309"/>
    <polyline points="867,299 872,304 867,309"/>
  </g>

  <!-- STEP 1 · Domain Intent · x90 center144 -->
  <g>
    <rect x="90" y="256" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(134,274)" fill="none" stroke="#0a0a0a" stroke-width="1.3">
      <circle cx="10" cy="6" r="5.2"/>
      <path d="M 2 19 Q 2 12 10 12 Q 18 12 18 19"/>
    </g>
    <text x="144" y="315" text-anchor="middle" class="nlabel">Domain</text>
    <text x="144" y="328" text-anchor="middle" class="nlabel">Intent</text>
    <text x="144" y="343" text-anchor="middle" class="ntime">~30 min</text>
  </g>

  <!-- STEP 2 · Ticket Filed · x222 center276 -->
  <g>
    <rect x="222" y="256" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(266,275)" fill="none" stroke="#0a0a0a" stroke-width="1.3">
      <path d="M 1 1 H 14 L 19 6 V 19 H 1 Z"/>
      <path d="M 14 1 V 6 H 19"/>
      <line x1="5" y1="10" x2="15" y2="10"/>
      <line x1="5" y1="14" x2="12" y2="14"/>
    </g>
    <text x="276" y="315" text-anchor="middle" class="nlabel">Ticket</text>
    <text x="276" y="328" text-anchor="middle" class="nlabel">Filed</text>
    <text x="276" y="343" text-anchor="middle" class="ntime">+3 days queue</text>
  </g>

  <!-- STEP 3 · Engineer Reads · x354 center408 -->
  <g>
    <rect x="354" y="256" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(398,275)" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6,3 0,10 6,17"/>
      <polyline points="14,3 20,10 14,17"/>
    </g>
    <text x="408" y="315" text-anchor="middle" class="nlabel">Engineer</text>
    <text x="408" y="328" text-anchor="middle" class="nlabel">Reads</text>
    <text x="408" y="343" text-anchor="middle" class="ntime">~2 hrs</text>
  </g>

  <!-- STEP 4 · TRANSLATE · the tax · x486 center540 · protrudes 12px -->
  <g>
    <rect x="486" y="244" width="108" height="120" rx="10" fill="#0a0a0a"/>
    <text x="540" y="272" text-anchor="middle" class="dbrow">THE TAX</text>
    <g transform="translate(530,282)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
      <path d="M 0 3 L 20 17"/>
      <path d="M 20 3 L 0 17"/>
    </g>
    <text x="540" y="325" text-anchor="middle" class="dlabel">Translate</text>
    <text x="540" y="344" text-anchor="middle" class="dtime">70% of build time</text>
  </g>

  <!-- STEP 5 · Build in Studio · x618 center672 -->
  <g>
    <rect x="618" y="256" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(662,275)" fill="none" stroke="#0a0a0a" stroke-width="1.3">
      <rect x="0" y="1"  width="8" height="7" rx="1.5"/>
      <rect x="12" y="1" width="8" height="7" rx="1.5"/>
      <rect x="6" y="12" width="8" height="7" rx="1.5"/>
      <line x1="4" y1="8" x2="9"  y2="12"/>
      <line x1="16" y1="8" x2="11" y2="12"/>
    </g>
    <text x="672" y="315" text-anchor="middle" class="nlabel">Build in</text>
    <text x="672" y="328" text-anchor="middle" class="nlabel">Studio</text>
    <text x="672" y="343" text-anchor="middle" class="ntime">~2 days</text>
  </g>

  <!-- STEP 6 · Review + Revise · x750 center804 -->
  <g>
    <rect x="750" y="256" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(794,275)" fill="none" stroke="#0a0a0a" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 2 14 A 8 8 0 1 1 18 11"/>
      <polyline points="0,7 2,14 9,12"/>
    </g>
    <text x="804" y="315" text-anchor="middle" class="nlabel">Review</text>
    <text x="804" y="328" text-anchor="middle" class="nlabel">+ Revise</text>
    <text x="804" y="343" text-anchor="middle" class="ntime">× N rounds</text>
  </g>

  <!-- STEP 7 · Ship · x882 center936 -->
  <g>
    <rect x="882" y="256" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
    <g transform="translate(926,276)" fill="none" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2,9 10,1 18,9"/>
      <line x1="10" y1="1" x2="10" y2="18"/>
    </g>
    <text x="936" y="321" text-anchor="middle" class="nlabel">Ship</text>
    <text x="936" y="343" text-anchor="middle" class="ntime">~3 weeks total</text>
  </g>

  <!-- feedback loop · Review back to Translate -->
  <path d="M 804 354 V 384 Q 804 392 794 392 H 550 Q 540 392 540 382 V 377"
        fill="none" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="540,367 535,378 545,378" fill="#0a0a0a"/>
  <text x="672" y="412" text-anchor="middle" class="note">every revision pays the tax again</text>

  <!-- DIVIDER -->
  <line x1="90" y1="446" x2="990" y2="446" stroke="#0a0a0a" stroke-width="0.6" stroke-dasharray="2 5"/>

  <!-- AFTER BAND -->
  <text x="540" y="492" text-anchor="middle" class="band">AFTER</text>
  <text x="540" y="524" text-anchor="middle" class="stat">Hours to days, on the happy path.</text>

  <!-- rail: nodeA center 306 to nodeC center 774 -->
  <line x1="306" y1="600" x2="774" y2="600" stroke="#0a0a0a" stroke-width="1.2"/>
  <g fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="377,595 382,600 377,605"/>
    <polyline points="697,595 702,600 697,605"/>
  </g>

  <!-- AFTER STEP A · Domain Intent · x252 center306 -->
  <g>
    <rect x="252" y="552" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(296,570)" fill="none" stroke="#0a0a0a" stroke-width="1.3">
      <circle cx="10" cy="6" r="5.2"/>
      <path d="M 2 19 Q 2 12 10 12 Q 18 12 18 19"/>
    </g>
    <text x="306" y="611" text-anchor="middle" class="nlabel">Domain</text>
    <text x="306" y="624" text-anchor="middle" class="nlabel">Intent</text>
    <text x="306" y="639" text-anchor="middle" class="ntime">~5 min</text>
  </g>

  <!-- AFTER · collapsed step · x400 w280 center540 -->
  <g>
    <rect x="400" y="542" width="280" height="116" rx="12" fill="#0a0a0a"/>
    <text x="540" y="574" text-anchor="middle" class="dbrow">THE COLLAPSED STEP</text>
    <text x="540" y="606" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Conversation with Qi</text>
    <g>
      <rect x="427" y="622" width="44" height="16" rx="8" fill="none" stroke="#6b6b6b" stroke-width="0.8"/>
      <text x="449" y="633" text-anchor="middle" class="chip">PARSE</text>
      <rect x="477" y="622" width="44" height="16" rx="8" fill="none" stroke="#6b6b6b" stroke-width="0.8"/>
      <text x="499" y="633" text-anchor="middle" class="chip">REUSE</text>
      <rect x="527" y="622" width="42" height="16" rx="8" fill="none" stroke="#6b6b6b" stroke-width="0.8"/>
      <text x="548" y="633" text-anchor="middle" class="chip">BUILD</text>
      <rect x="575" y="622" width="36" height="16" rx="8" fill="none" stroke="#6b6b6b" stroke-width="0.8"/>
      <text x="593" y="633" text-anchor="middle" class="chip">DIFF</text>
      <rect x="617" y="622" width="36" height="16" rx="8" fill="none" stroke="#6b6b6b" stroke-width="0.8"/>
      <text x="635" y="633" text-anchor="middle" class="chip">TEST</text>
    </g>
  </g>

  <!-- AFTER STEP C · Ship · x720 center774 -->
  <g>
    <rect x="720" y="552" width="108" height="96" rx="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
    <g transform="translate(764,572)" fill="none" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="2,9 10,1 18,9"/>
      <line x1="10" y1="1" x2="10" y2="18"/>
    </g>
    <text x="774" y="617" text-anchor="middle" class="nlabel">Ship</text>
    <text x="774" y="639" text-anchor="middle" class="ntime">same day</text>
  </g>

  <!-- MEGA STAT -->
  <line x1="480" y1="694" x2="600" y2="694" stroke="#0a0a0a" stroke-width="1"/>
  <text x="540" y="748" text-anchor="middle" class="mega">−85%</text>
  <text x="540" y="772" text-anchor="middle" class="megasub">projected reduction in workflow buildout time</text>

  <text x="540" y="806" text-anchor="middle" class="foot">The whole redesign is an attempt to take that tax to zero.</text>
</svg>
