<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 1080 720"><rect width="1080" height="720" fill="#f7f7f5" rx="18"/><text x="540" y="50" fill="#6b6b6b" font-size="11" font-weight="600" letter-spacing="2.5" text-anchor="middle">SURFACE 01 — ADMIN CONSOLE</text><text x="540" y="80" fill="#0a0a0a" font-size="20" font-weight="700" text-anchor="middle">The Control Tower</text><g transform="translate(120 128)"><rect width="840" height="500" fill="#fff" stroke="#0a0a0a" stroke-width="1.5" rx="10"/><rect width="840" height="32" fill="#ededed" rx="10"/><path fill="#ededed" d="M0 22h840v10H0z"/><path stroke="#0a0a0a" d="M0 32h840"/><circle cx="16" cy="16" r="4" fill="none" stroke="#0a0a0a"/><circle cx="30" cy="16" r="4" fill="none" stroke="#0a0a0a"/><circle cx="44" cy="16" r="4" fill="none" stroke="#0a0a0a"/><rect width="120" height="16" x="64" y="8" fill="#fff" stroke="#0a0a0a" stroke-width=".6" rx="3"/><text x="74" y="19" fill="#6b6b6b" font-size="8" font-weight="600">admin.kirana</text><rect width="800" height="430" x="20" y="52" fill="#ededed" stroke="#0a0a0a" stroke-dasharray="4 4" stroke-width=".8" rx="4"/><text x="420" y="252" fill="#6b6b6b" font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle">ADMIN ORDERS DASHBOARD SCREENSHOT</text><text x="420" y="272" fill="#6b6b6b" font-size="11" font-style="italic" text-anchor="middle">Drop your Figma export here (recommended: 800 × 430 px)</text></g><path stroke="#0a0a0a" d="m220 200 60 26"/><circle cx="280" cy="226" r="3" fill="#0a0a0a"/><g transform="translate(40 168)"><circle cx="14" cy="14" r="14" fill="#0a0a0a"/><text x="14" y="18" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">01</text><text x="36" y="12" fill="#0a0a0a" font-size="11" font-weight="700">Status tabs as nav</text><text x="36" y="26" fill="#6b6b6b" font-size="10">Owners jump by state,</text><text x="36" y="38" fill="#6b6b6b" font-size="10">not by date.</text></g><path stroke="#0a0a0a" d="m280 488 60-38"/><circle cx="340" cy="450" r="3" fill="#0a0a0a"/><g transform="translate(40 500)"><circle cx="14" cy="14" r="14" fill="#0a0a0a"/><text x="14" y="18" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">02</text><text x="36" y="12" fill="#0a0a0a" font-size="11" font-weight="700">Compact tabular density</text><text x="36" y="26" fill="#6b6b6b" font-size="10">Eight fields per row,</text><text x="36" y="38" fill="#6b6b6b" font-size="10">no horizontal scroll.</text></g><path stroke="#0a0a0a" d="m860 280-60 50"/><circle cx="800" cy="330" r="3" fill="#0a0a0a"/><g transform="translate(860 248)"><circle cx="14" cy="14" r="14" fill="#0a0a0a"/><text x="14" y="18" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">03</text><text x="36" y="12" fill="#0a0a0a" font-size="11" font-weight="700">Inline status badges</text><text x="36" y="26" fill="#6b6b6b" font-size="10">Colour, icon, and text —</text><text x="36" y="38" fill="#6b6b6b" font-size="10">never colour alone.</text></g><path stroke="#0a0a0a" d="m860 500-60-40"/><circle cx="800" cy="460" r="3" fill="#0a0a0a"/><g transform="translate(860 500)"><circle cx="14" cy="14" r="14" fill="#0a0a0a"/><text x="14" y="18" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">04</text><text x="36" y="12" fill="#0a0a0a" font-size="11" font-weight="700">Drill-down without loss</text><text x="36" y="26" fill="#6b6b6b" font-size="10">Order detail opens in</text><text x="36" y="38" fill="#6b6b6b" font-size="10">a side panel, not a page.</text></g><text x="540" y="680" fill="#6b6b6b" font-size="11" font-style="italic" text-anchor="middle">Every entity behaves like a self-contained module — owners navigate by intent, not by hierarchy.</text></svg>