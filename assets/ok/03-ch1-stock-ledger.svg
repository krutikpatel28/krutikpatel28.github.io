<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="Inter, 'Inter var', system-ui, -apple-system, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
<defs>

<pattern id="lossHatch" patternUnits="userSpaceOnUse" width="6" height="6"
         patternTransform="rotate(45)">
  <rect width="6" height="6" fill="#FAE8E3"/>
  <line x1="0" y1="0" x2="0" y2="6" stroke="#C8452A" stroke-width="1" opacity="0.55"/>
</pattern>

</defs>
<rect x="0" y="0" width="880" height="420" rx="18" fill="#F7F7F5"/>
<text x="440" y="42" font-size="10.5" font-weight="600" fill="#75756E" text-anchor="middle" letter-spacing="2.4">STOCK VANISHES BETWEEN RECEIPT AND RACK</text>
<text x="440" y="76" font-size="25" font-weight="800" fill="#0F0F0E" text-anchor="middle" letter-spacing="-0.5">50 kg in. 46.4 kg on the rack.</text>
<rect x="64" y="104" width="752" height="232" rx="12" fill="#FFFFFF" stroke="#E3E3DE" stroke-width="1"/>
<line x1="600" y1="134" x2="600" y2="306" stroke="#E3E3DE" stroke-width="1"/>
<text x="152" y="150" font-size="9.5" font-weight="700" fill="#75756E" text-anchor="middle" letter-spacing="1.6">ONE SACK</text>
<g transform="translate(98,162)">
<path d="M 33.32 10 C 38.58 -3 69.42 -3 74.68 10 Z" fill="#EAEAE5" stroke="#0F0F0E" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M 31.32 20 C 22.32 33 3 40 1.5 56 Q -0.5 85.76 2 120 Q 2 134 15 134 L 93 134 Q 106 134 106 120 Q 108.5 85.76 106.5 56 C 105 40 85.68 33 76.68 20 Z" fill="#EAEAE5" stroke="#0F0F0E" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M 34.32 23 C 29.32 34 14 40 12 54" fill="none" stroke="#CFCFC8" stroke-width="1" stroke-linejoin="round"/>
<path d="M 73.68 23 C 78.68 34 94 40 96 54" fill="none" stroke="#CFCFC8" stroke-width="1" stroke-linejoin="round"/>
<rect x="29.32" y="9" width="49.36" height="11" rx="2" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.3"/>
<rect x="18.36" y="60.3" width="71.28" height="32.16" rx="2" fill="#FFFFFF" stroke="#0F0F0E" stroke-width="1.2"/>
<text x="54" y="74.3" font-size="8.5" font-weight="700" fill="#75756E" text-anchor="middle" letter-spacing="0.8">TOOR DAL</text>
<text x="54" y="88.3" font-size="10" font-weight="800" fill="#0F0F0E" text-anchor="middle">LOT 5104</text>
</g>
<text x="246" y="150" font-size="9.5" font-weight="700" fill="#75756E" letter-spacing="1.6">WEIGHED IN AT THE GATE</text>
<text x="572" y="150" font-size="13" font-weight="800" fill="#0F0F0E" text-anchor="end">50.0 kg</text>
<rect x="246" y="160" width="326" height="22" rx="4" fill="#F1F1ED" stroke="#E3E3DE" stroke-width="1"/>
<rect x="246" y="160" width="326" height="22" rx="4" fill="#0F0F0E"/>
<text x="246" y="216" font-size="9.5" font-weight="700" fill="#75756E" letter-spacing="1.6">FOUND ON THE RACK</text>
<text x="572" y="216" font-size="13" font-weight="800" fill="#0F0F0E" text-anchor="end">46.4 kg</text>
<rect x="246" y="226" width="326" height="22" rx="4" fill="#F1F1ED" stroke="#E3E3DE" stroke-width="1"/>
<path d="M 250 226 H 548.53 V 248 H 250 a 4 4 0 0 1 -4 -4 V 230 a 4 4 0 0 1 4 -4 Z" fill="#0F0F0E"/>
<path d="M 548.53 226 H 568 a 4 4 0 0 1 4 4 V 244 a 4 4 0 0 1 -4 4 H 548.53 V 226 Z" fill="url(#lossHatch)" stroke="#C8452A" stroke-width="1" stroke-linejoin="round"/>
<line x1="560.26" y1="250" x2="560.26" y2="268" stroke="#C8452A" stroke-width="1" stroke-dasharray="2 2"/>
<rect x="448.58" y="268" width="123.42" height="19" rx="9.5" fill="#FAE8E3" stroke="#EFC8BC" stroke-width="1"/>
<text x="510.29" y="280.69" font-size="9" font-weight="700" fill="#C8452A" text-anchor="middle" letter-spacing="0.6">−3.6 kg unaccounted</text>
<text x="246" y="281.5" font-size="10.5" font-weight="400" fill="#75756E">spillage · partial bags · miscounts</text>
<text x="628" y="194" font-size="54" font-weight="800" fill="#0F0F0E" letter-spacing="-2">7%</text>
<line x1="628" y1="210" x2="792" y2="210" stroke="#0F0F0E" stroke-width="1.4"/>
<text x="628" y="232" font-size="12" font-weight="700" fill="#0F0F0E">silent shrinkage</text>
<text x="628" y="250" font-size="10.5" font-weight="400" fill="#75756E">per sack, per fortnight —</text>
<text x="628" y="264.5" font-size="10.5" font-weight="400" fill="#75756E">invisible to a paper ledger.</text>
<text x="628" y="294" font-size="9" font-weight="700" fill="#75756E" letter-spacing="1.2">INDUSTRY RANGE 5–10%</text>
<text x="440" y="388" font-size="10.5" font-weight="400" fill="#75756E" text-anchor="middle" font-style="italic">Bulk grocery is sold by weight, so a 50 kg sack becomes a hundred invoices — and every rounding hides a loss.</text>
</svg>
