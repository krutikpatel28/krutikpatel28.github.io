<text x="638" y="446" font-size="10" font-weight="400" fill="#75756E">stays highlighted.</text>
<text x="440" y="508" font-size="10.5" font-weight="400" fill="#75756E" text-anchor="middle" font-style="italic">Every rack and batch becomes a tappable cell carrying weight, lot date and pick priority.</text>
