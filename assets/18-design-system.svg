<svg width="1080" height="790" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 790" font-family="DM Sans, Inter, system-ui, sans-serif">
  <style>
    .eyebrow  { font-size: 11px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 500; }
    .title    { font-size: 32px;   font-weight: 700; fill: #0a0a0a; letter-spacing: -0.5px; }
    .sub      { font-size: 14px;   fill: #6b6b6b; }
    .cardlbl  { font-size: 10px;   letter-spacing: 0.2em;  fill: #6b6b6b; font-weight: 700; }
    .sublbl   { font-size: 9px;    letter-spacing: 0.14em; fill: #8a8a8a; font-weight: 700; }
    .name     { font-size: 16px;   font-weight: 700; fill: #0a0a0a; }
    .meta     { font-size: 10px;   fill: #6b6b6b; }
    .wlbl     { font-size: 9.5px;  fill: #6b6b6b; }
    .note     { font-size: 10px;   fill: #6b6b6b; }
    .tab      { font-size: 22px;   font-weight: 700; fill: #0a0a0a; font-variant-numeric: tabular-nums; }
    .pill     { font-size: 9px;    font-weight: 700; letter-spacing: 0.02em; }
    .foot     { font-size: 11px;   fill: #6b6b6b; font-style: italic; }
  </style>

  <defs>
    <!-- Qi brand gradient · hero type and AI-authored actions -->
    <linearGradient id="qiHero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="52%"  stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <!-- Primary action gradient · Create / Publish buttons -->
    <linearGradient id="qiCta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <!-- Qi mark tile -->
    <linearGradient id="qiMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <!-- Agent avatar gradients · seeded from agent name -->
    <linearGradient id="av1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2DD4BF"/><stop offset="100%" stop-color="#22C55E"/></linearGradient>
    <linearGradient id="av2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="av3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F472B6"/><stop offset="100%" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="av4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FBBF24"/><stop offset="100%" stop-color="#F97316"/></linearGradient>
    <linearGradient id="av5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="av6" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#34D399"/><stop offset="100%" stop-color="#0D9488"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="790" rx="18" fill="#f7f7f5"/>

  <!-- HEADER -->
  <text x="540" y="56"  text-anchor="middle" class="eyebrow">VISUAL LANGUAGE</text>
  <text x="540" y="102" text-anchor="middle" class="title">Confidence without intimidation.</text>
  <text x="540" y="132" text-anchor="middle" class="sub">Calm chrome, so the artifact and the conversation carry the interest.</text>

  <!-- ============ CARD 1 · TYPOGRAPHY · x50 y176 ============ -->
  <rect x="50" y="176" width="468" height="260" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
  <text x="74" y="206" class="cardlbl">TYPOGRAPHY</text>

  <text x="74" y="304" font-size="88" font-weight="700" fill="#0a0a0a" letter-spacing="-3">Aa</text>
  <text x="74" y="332" class="name">DM Sans</text>
  <text x="74" y="350" class="meta">Geometric sans · 400–700</text>

  <g>
    <text x="258" y="240" font-size="24" font-weight="400" fill="#0a0a0a">Aa</text>
    <text x="296" y="240" class="wlbl">Regular · 400 · body</text>
    <text x="258" y="278" font-size="24" font-weight="500" fill="#0a0a0a">Aa</text>
    <text x="296" y="278" class="wlbl">Medium · 500 · labels</text>
    <text x="258" y="316" font-size="24" font-weight="700" fill="#0a0a0a">Aa</text>
    <text x="296" y="316" class="wlbl">Bold · 700 · headings</text>
  </g>

  <line x1="74" y1="368" x2="494" y2="368" stroke="#ededed" stroke-width="1"/>
  <text x="74" y="390" class="sublbl">TABULAR NUMERALS</text>
  <text x="74" y="418" class="tab">92% · v2.1 · 1.0M ctx</text>

  <!-- ============ CARD 2 · COLOUR + GRADIENT · x562 y176 ============ -->
  <rect x="562" y="176" width="468" height="260" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
  <text x="586" y="206" class="cardlbl">COLOUR &amp; GRADIENT</text>

  <!-- Qi mark tile -->
  <rect x="586" y="220" width="38" height="38" rx="10" fill="url(#qiMark)"/>
  <text x="605" y="245" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Qi</text>
  <text x="636" y="236" class="name">The Qi mark</text>
  <text x="636" y="252" class="meta">Brand · chat avatar · QiPilot affordance</text>

  <!-- brand gradient bar + stops -->
  <rect x="586" y="274" width="420" height="26" rx="6" fill="url(#qiHero)"/>
  <text x="586" y="316" class="sublbl">BRAND GRADIENT · HERO TYPE + AI-AUTHORED ACTIONS</text>

  <g>
    <rect x="586" y="328" width="14" height="14" rx="3" fill="#8B5CF6"/>
    <text x="606" y="339" class="meta">#8B5CF6</text>
    <rect x="726" y="328" width="14" height="14" rx="3" fill="#D946EF"/>
    <text x="746" y="339" class="meta">#D946EF</text>
    <rect x="866" y="328" width="14" height="14" rx="3" fill="#FB923C"/>
    <text x="886" y="339" class="meta">#FB923C</text>
  </g>

  <line x1="586" y1="364" x2="1006" y2="364" stroke="#ededed" stroke-width="1"/>
  <text x="586" y="384" class="sublbl">SEMANTIC STATUS</text>

  <g>
    <rect x="586" y="392" width="76" height="24" rx="12" fill="#DCFCE7"/>
    <text x="624" y="408" text-anchor="middle" class="pill" fill="#15803D">LIVE</text>
    <rect x="672" y="392" width="76" height="24" rx="12" fill="#FEE2E2"/>
    <text x="710" y="408" text-anchor="middle" class="pill" fill="#B91C1C">EXPIRED</text>
    <rect x="758" y="392" width="76" height="24" rx="12" fill="#FEF3C7"/>
    <text x="796" y="408" text-anchor="middle" class="pill" fill="#B45309">PENDING</text>
    <rect x="844" y="392" width="76" height="24" rx="12" fill="#DBEAFE"/>
    <text x="882" y="408" text-anchor="middle" class="pill" fill="#1D4ED8">RUNNING</text>
    <rect x="930" y="392" width="76" height="24" rx="12" fill="#F3F4F6"/>
    <text x="968" y="408" text-anchor="middle" class="pill" fill="#4B5563">DRAFT</text>
  </g>

  <!-- ============ CARD 3 · ICONOGRAPHY + AVATARS · x50 y464 ============ -->
  <rect x="50" y="464" width="468" height="260" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
  <text x="74" y="494" class="cardlbl">ICONOGRAPHY &amp; AVATARS</text>

  <text x="74" y="520" class="sublbl">24 PX LINE SET · INK ONLY</text>
  <g transform="translate(74,532)" fill="none" stroke="#0a0a0a" stroke-width="1.5">
    <g transform="translate(0,0)"><rect x="2" y="5" width="20" height="15" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></g>
    <g transform="translate(46,0)" stroke-linejoin="round"><polygon points="14,1 5,13 11,13 9,23 18,10 12,10"/></g>
    <g transform="translate(92,0)" stroke-linecap="round" stroke-linejoin="round"><polyline points="7,3 0,12 7,21"/><polyline points="17,3 24,12 17,21"/></g>
    <g transform="translate(138,0)"><path d="M 1 4 V 21 Q 1 23 3 23 H 22 V 4 Q 22 2 20 2 H 12 V 23"/></g>
    <g transform="translate(184,0)" stroke-linecap="round"><path d="M 1 6 H 6 V 3"/><path d="M 1 19 H 6 V 22"/><rect x="6" y="7" width="10" height="11" rx="1.5"/><line x1="16" y1="12" x2="23" y2="12"/></g>
    <g transform="translate(230,0)"><rect x="0.5" y="13" width="5" height="9" rx="1"/><rect x="8.5" y="7" width="5" height="15" rx="1"/><rect x="16.5" y="2" width="5" height="20" rx="1"/></g>
    <g transform="translate(276,0)"><circle cx="12" cy="12" r="10"/><path d="M 12 6 V 12 L 16 15"/></g>
    <g transform="translate(322,0)"><circle cx="10" cy="10" r="7"/><line x1="15" y1="15" x2="22" y2="22" stroke-linecap="round"/></g>
    <g transform="translate(368,0)" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,13 10,20 21,4" stroke-width="2.2"/></g>
  </g>

  <line x1="74" y1="580" x2="494" y2="580" stroke="#ededed" stroke-width="1"/>
  <text x="74" y="602" class="sublbl">AGENT AVATARS · GRADIENT SEEDED FROM NAME</text>

  <g transform="translate(74,614)">
    <rect x="0"   y="0" width="42" height="42" rx="10" fill="url(#av1)"/>
    <text x="21"  y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">RA</text>
    <rect x="56"  y="0" width="42" height="42" rx="10" fill="url(#av2)"/>
    <text x="77"  y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">DV</text>
    <rect x="112" y="0" width="42" height="42" rx="10" fill="url(#av3)"/>
    <text x="133" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CA</text>
    <rect x="168" y="0" width="42" height="42" rx="10" fill="url(#av4)"/>
    <text x="189" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SO</text>
    <rect x="224" y="0" width="42" height="42" rx="10" fill="url(#av5)"/>
    <text x="245" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">CL</text>
    <rect x="280" y="0" width="42" height="42" rx="10" fill="url(#av6)"/>
    <text x="301" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">EQ</text>
  </g>

  <text x="74" y="684" class="note">Two-letter initials on a gradient derived from the agent's name —</text>
  <text x="74" y="700" class="note">so every agent is recognisable without being anthropomorphised.</text>

  <!-- ============ CARD 4 · TAGS + PILLS · x562 y464 ============ -->
  <rect x="562" y="464" width="468" height="260" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
  <text x="586" y="494" class="cardlbl">TAGS &amp; PILLS</text>

  <text x="586" y="520" class="sublbl">DOMAIN TAXONOMY · COLOUR-CODED BY PROCESS AREA</text>

  <g>
    <rect x="586" y="530" width="122" height="24" rx="12" fill="#E0E7FF"/>
    <text x="647" y="546" text-anchor="middle" class="pill" fill="#4338CA">Source to Contract</text>
    <rect x="716" y="530" width="138" height="24" rx="12" fill="#F3E8FF"/>
    <text x="785" y="546" text-anchor="middle" class="pill" fill="#7E22CE">Contract Management</text>
    <rect x="862" y="530" width="72" height="24" rx="12" fill="#DBEAFE"/>
    <text x="898" y="546" text-anchor="middle" class="pill" fill="#1D4ED8">Supplier</text>
  </g>

  <g>
    <rect x="586" y="562" width="46" height="24" rx="12" fill="#CCFBF1"/>
    <text x="609" y="578" text-anchor="middle" class="pill" fill="#0F766E">S2P</text>
    <rect x="640" y="562" width="46" height="24" rx="12" fill="#FEF3C7"/>
    <text x="663" y="578" text-anchor="middle" class="pill" fill="#B45309">P2P</text>
    <rect x="694" y="562" width="66" height="24" rx="12" fill="#FCE7F3"/>
    <text x="727" y="578" text-anchor="middle" class="pill" fill="#BE185D">Function</text>
    <rect x="768" y="562" width="68" height="24" rx="12" fill="#DCFCE7"/>
    <text x="802" y="578" text-anchor="middle" class="pill" fill="#15803D">Sourcing</text>
  </g>

  <line x1="586" y1="606" x2="1006" y2="606" stroke="#ededed" stroke-width="1"/>
  <text x="586" y="628" class="sublbl">STATE · COLOUR NEVER CARRIES MEANING ALONE</text>

  <g transform="translate(586,638)">
    <rect x="0" y="0" width="90" height="24" rx="12" fill="#DCFCE7"/>
    <circle cx="14" cy="12" r="3.4" fill="#15803D"/>
    <text x="54" y="16" text-anchor="middle" class="pill" fill="#15803D">Connected</text>

    <rect x="98" y="0" width="80" height="24" rx="12" fill="#FEE2E2"/>
    <g transform="translate(108,6)" stroke="#B91C1C" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M 4 0 V 6"/><path d="M 4 9 V 10"/>
    </g>
    <text x="145" y="16" text-anchor="middle" class="pill" fill="#B91C1C">Expired</text>

    <rect x="186" y="0" width="86" height="24" rx="12" fill="#DBEAFE"/>
    <g transform="translate(196,7)" stroke="#1D4ED8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="0,5 3,8 8,1"/>
    </g>
    <text x="234" y="16" text-anchor="middle" class="pill" fill="#1D4ED8">Reviewed</text>

    <rect x="280" y="0" width="72" height="24" rx="12" fill="#F3F4F6"/>
    <circle cx="294" cy="12" r="3.4" fill="none" stroke="#4B5563" stroke-width="1.2"/>
    <text x="322" y="16" text-anchor="middle" class="pill" fill="#4B5563">Draft</text>
  </g>

  <text x="586" y="694" class="note">Every state pill pairs a colour with a glyph and a word — readable</text>
  <text x="586" y="710" class="note">for colour-blind users and legible at a glance in dense catalogues.</text>

  <text x="540" y="762" text-anchor="middle" class="foot">Colour lives in the data and the domain. The interface chrome stays out of the way.</text>
</svg>
