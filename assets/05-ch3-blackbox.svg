<svg width="1080" height="560" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="Inter, system-ui, sans-serif">
  <style>
    .eyebrow { font-size: 11px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 600; }
    .title   { font-size: 32px;   font-weight: 800; fill: #0a0a0a; letter-spacing: -0.5px; }
    .sub     { font-size: 14px;   fill: #6b6b6b; }
    .panel   { font-size: 10px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 700; }
    .io      { font-size: 9.5px;  letter-spacing: 0.18em; fill: #6b6b6b; font-weight: 700; }
    .opaque  { font-size: 13px;   font-weight: 700; fill: #8a8a8a; }
    .opaques { font-size: 10.5px; fill: #6b6b6b; }
    .iplabel { font-size: 9px;    letter-spacing: 0.14em; fill: #6b6b6b; font-weight: 700; }
    .ipvalue { font-size: 12px;   font-weight: 700; fill: #0a0a0a; }
    .cap     { font-size: 11px;   fill: #6b6b6b; font-style: italic; }
  </style>

  <rect x="0" y="0" width="1080" height="560" rx="18" fill="#f7f7f5"/>

  <!-- HEADER -->
  <text x="540" y="56"  text-anchor="middle" class="eyebrow">FROM BLACK BOX TO INSPECTABLE</text>
  <text x="540" y="102" text-anchor="middle" class="title">Trust comes from inspection, not magic.</text>
  <text x="540" y="132" text-anchor="middle" class="sub">"The AI did it" is not an acceptable answer to an auditor.</text>

  <!-- centre divider between the two panels -->
  <line x1="540" y1="176" x2="540" y2="512" stroke="#0a0a0a" stroke-width="0.6" stroke-dasharray="2 5"/>

  <!-- ================= PANEL 1 · centre 284 ================= -->
  <text x="284" y="196" text-anchor="middle" class="panel">PURE-PROMPT AI</text>

  <text x="284" y="236" text-anchor="middle" class="io">INPUT</text>
  <g stroke="#0a0a0a" stroke-width="1.3" fill="#0a0a0a">
    <line x1="284" y1="246" x2="284" y2="264"/>
    <polygon points="284,272 279,263 289,263" stroke="none"/>
  </g>

  <!-- sealed box -->
  <rect x="124" y="282" width="320" height="150" rx="12" fill="#0a0a0a"/>
  <text x="284" y="352" text-anchor="middle" font-size="46" font-weight="900" fill="#3a3a3a">?</text>
  <text x="284" y="382" text-anchor="middle" class="opaque">opaque</text>
  <text x="284" y="402" text-anchor="middle" class="opaques">no inspection points</text>

  <g stroke="#0a0a0a" stroke-width="1.3" fill="#0a0a0a">
    <line x1="284" y1="440" x2="284" y2="458"/>
    <polygon points="284,466 279,457 289,457" stroke="none"/>
  </g>
  <text x="284" y="486" text-anchor="middle" class="io">DECISION</text>

  <text x="284" y="524" text-anchor="middle" class="cap">Not auditable. Not adoptable in procurement.</text>

  <!-- ================= PANEL 2 · centre 796 ================= -->
  <text x="796" y="196" text-anchor="middle" class="panel">INSPECTABLE AI</text>

  <text x="796" y="236" text-anchor="middle" class="io">INPUT</text>
  <g stroke="#0a0a0a" stroke-width="1.3" fill="#0a0a0a">
    <line x1="796" y1="246" x2="796" y2="264"/>
    <polygon points="796,272 791,263 801,263" stroke="none"/>
  </g>

  <!-- open box with three inspection points -->
  <rect x="636" y="282" width="320" height="150" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>

  <g transform="translate(660,306)">
    <circle cx="11" cy="11" r="11" fill="#0a0a0a"/>
    <text x="11" y="15" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">01</text>
    <text x="32" y="8"  class="iplabel">CONFIDENCE</text>
    <text x="32" y="22" class="ipvalue">92% on Reuse</text>
  </g>

  <g transform="translate(660,350)">
    <circle cx="11" cy="11" r="11" fill="#0a0a0a"/>
    <text x="11" y="15" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">02</text>
    <text x="32" y="8"  class="iplabel">SENTENCE DIFF</text>
    <text x="32" y="22" class="ipvalue">Modified · New · Removed</text>
  </g>

  <g transform="translate(660,394)">
    <circle cx="11" cy="11" r="11" fill="#0a0a0a"/>
    <text x="11" y="15" text-anchor="middle" font-size="9" font-weight="800" fill="#ffffff">03</text>
    <text x="32" y="8"  class="iplabel">CHECKPOINT HISTORY</text>
    <text x="32" y="22" class="ipvalue">1.1 · 1.2 · 1.3 · View Changes</text>
  </g>

  <g stroke="#0a0a0a" stroke-width="1.3" fill="#0a0a0a">
    <line x1="796" y1="440" x2="796" y2="458"/>
    <polygon points="796,466 791,457 801,457" stroke="none"/>
  </g>
  <text x="796" y="486" text-anchor="middle" class="io">DECISION</text>

  <text x="796" y="524" text-anchor="middle" class="cap">Every AI action shows its work — and what changed.</text>
</svg>
