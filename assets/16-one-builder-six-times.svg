<svg width="1200" height="640" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, system-ui, sans-serif">
  <style>
    .eyebrow { font-size: 11px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 600; }
    .title   { font-size: 32px;   font-weight: 800; fill: #0a0a0a; letter-spacing: -0.5px; }
    .sub     { font-size: 14px;   fill: #6b6b6b; }
    .cardlbl { font-size: 10px;   letter-spacing: 0.2em; fill: #0a0a0a; font-weight: 700; }
    .panelbl { font-size: 6.5px;  letter-spacing: 0.14em; fill: #8a8a8a; font-weight: 700; }
    .foot    { font-size: 11px;   fill: #6b6b6b; font-style: italic; }
  </style>

  <rect x="0" y="0" width="1200" height="640" rx="18" fill="#f7f7f5"/>

  <!-- HEADER -->
  <text x="600" y="56"  text-anchor="middle" class="eyebrow">ONE BUILDER, SIX TIMES</text>
  <text x="600" y="102" text-anchor="middle" class="title">Same pattern. Different primitive.</text>
  <text x="600" y="132" text-anchor="middle" class="sub">Chat left, artifact right — for every object on the platform.</text>

  <!-- ============ reusable skeleton, drawn per cell ============ -->
  <!-- cell: 340 × 150 · chat pane 0–118 · artifact pane 118–340 -->

  <defs>
    <g id="builderShell">
      <rect x="0" y="0" width="340" height="150" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.1"/>
      <line x1="118" y1="0" x2="118" y2="150" stroke="#0a0a0a" stroke-width="0.9"/>
      <!-- chat pane -->
      <text x="10" y="16" class="panelbl">CHAT</text>
      <rect x="10" y="24" width="62" height="9"  rx="2" fill="#ededed"/>
      <rect x="34" y="38" width="52" height="9"  rx="2" fill="#0a0a0a"/>
      <rect x="10" y="52" width="76" height="16" rx="2" fill="#ededed"/>
      <rect x="10" y="73" width="44" height="9"  rx="2" fill="#ededed"/>
      <rect x="10" y="126" width="98" height="16" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-dasharray="2 2"/>
      <!-- artifact pane header -->
      <text x="130" y="16" class="panelbl">ARTIFACT</text>
    </g>
  </defs>

  <!-- ================= ROW 1 ================= -->

  <!-- AGENT · x 54 -->
  <g transform="translate(54,196)">
    <text x="2" y="-10" class="cardlbl">AGENT</text>
    <use href="#builderShell"/>
    <g transform="translate(130,24)">
      <rect x="0" y="0" width="46" height="6" rx="1.5" fill="#0a0a0a"/>
      <rect x="0" y="12" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="19" width="176" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="26" width="186" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="42" width="40" height="6" rx="1.5" fill="#0a0a0a"/>
      <rect x="0" y="54" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="61" width="164" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="76" width="196" height="18" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
      <rect x="6" y="82" width="60" height="3" rx="1.5" fill="#6b6b6b"/>
      <rect x="6" y="88" width="90" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="102" width="120" height="3" rx="1.5" fill="#c0c0c0"/>
    </g>
  </g>

  <!-- SKILL · x 430 -->
  <g transform="translate(430,196)">
    <text x="2" y="-10" class="cardlbl">SKILL</text>
    <use href="#builderShell"/>
    <g transform="translate(130,24)">
      <rect x="0" y="0" width="46" height="6" rx="1.5" fill="#0a0a0a"/>
      <rect x="0" y="12" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="19" width="176" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="26" width="186" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="42" width="40" height="6" rx="1.5" fill="#0a0a0a"/>
      <!-- skill: numbered step list -->
      <g transform="translate(0,54)">
        <circle cx="4" cy="4" r="3.4" fill="#0a0a0a"/>
        <rect x="14" y="2" width="120" height="3" rx="1.5" fill="#c0c0c0"/>
        <circle cx="4" cy="16" r="3.4" fill="#0a0a0a"/>
        <rect x="14" y="14" width="150" height="3" rx="1.5" fill="#c0c0c0"/>
        <circle cx="4" cy="28" r="3.4" fill="none" stroke="#0a0a0a" stroke-width="0.9"/>
        <rect x="14" y="26" width="104" height="3" rx="1.5" fill="#c0c0c0"/>
      </g>
      <rect x="0" y="96" width="196" height="18" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
      <rect x="6" y="102" width="70" height="3" rx="1.5" fill="#6b6b6b"/>
      <rect x="6" y="108" width="100" height="3" rx="1.5" fill="#c0c0c0"/>
    </g>
  </g>

  <!-- TOOL · x 806 -->
  <g transform="translate(806,196)">
    <text x="2" y="-10" class="cardlbl">TOOL</text>
    <use href="#builderShell"/>
    <g transform="translate(130,24)">
      <rect x="0" y="0" width="46" height="6" rx="1.5" fill="#0a0a0a"/>
      <rect x="0" y="12" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="19" width="176" height="3" rx="1.5" fill="#c0c0c0"/>
      <!-- tool: code block -->
      <rect x="0" y="32" width="196" height="62" rx="3" fill="#0a0a0a"/>
      <rect x="8" y="40" width="60" height="3" rx="1.5" fill="#6b6b6b"/>
      <rect x="8" y="48" width="96" height="3" rx="1.5" fill="#8a8a8a"/>
      <rect x="16" y="56" width="120" height="3" rx="1.5" fill="#6b6b6b"/>
      <rect x="16" y="64" width="80" height="3" rx="1.5" fill="#6b6b6b"/>
      <rect x="8" y="72" width="52" height="3" rx="1.5" fill="#8a8a8a"/>
      <rect x="8" y="82" width="40" height="3" rx="1.5" fill="#6b6b6b"/>
      <rect x="0" y="102" width="130" height="3" rx="1.5" fill="#c0c0c0"/>
    </g>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- KNOWLEDGE · x 54 -->
  <g transform="translate(54,426)">
    <text x="2" y="-10" class="cardlbl">KNOWLEDGE</text>
    <use href="#builderShell"/>
    <g transform="translate(130,24)">
      <rect x="0" y="0" width="46" height="6" rx="1.5" fill="#0a0a0a"/>
      <rect x="0" y="12" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="19" width="176" height="3" rx="1.5" fill="#c0c0c0"/>
      <!-- knowledge: document chips -->
      <g transform="translate(0,32)">
        <rect x="0"  y="0" width="60" height="26" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <rect x="6"  y="6" width="14" height="14" rx="2" fill="#ededed"/>
        <rect x="24" y="8" width="30" height="3" rx="1.5" fill="#c0c0c0"/>
        <rect x="24" y="14" width="22" height="3" rx="1.5" fill="#ededed"/>
        <rect x="68" y="0" width="60" height="26" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <rect x="74" y="6" width="14" height="14" rx="2" fill="#ededed"/>
        <rect x="92" y="8" width="30" height="3" rx="1.5" fill="#c0c0c0"/>
        <rect x="136" y="0" width="60" height="26" rx="3" fill="#0a0a0a"/>
      </g>
      <rect x="0" y="70" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="77" width="150" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="90" width="196" height="18" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
      <rect x="6" y="96" width="66" height="3" rx="1.5" fill="#6b6b6b"/>
      <rect x="6" y="102" width="94" height="3" rx="1.5" fill="#c0c0c0"/>
    </g>
  </g>

  <!-- WIDGET · x 430 -->
  <g transform="translate(430,426)">
    <text x="2" y="-10" class="cardlbl">WIDGET</text>
    <use href="#builderShell"/>
    <g transform="translate(130,24)">
      <rect x="0" y="0" width="46" height="6" rx="1.5" fill="#0a0a0a"/>
      <rect x="0" y="12" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <!-- widget: chart preview -->
      <rect x="0" y="24" width="196" height="60" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
      <polyline points="10,72 34,58 58,64 82,44 106,52 130,36 154,44 186,30"
                fill="none" stroke="#0a0a0a" stroke-width="1.1"/>
      <g fill="#0a0a0a">
        <circle cx="34" cy="58" r="1.6"/><circle cx="82" cy="44" r="1.6"/>
        <circle cx="130" cy="36" r="1.6"/><circle cx="186" cy="30" r="1.6"/>
      </g>
      <rect x="0" y="92" width="120" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="99" width="90" height="3" rx="1.5" fill="#c0c0c0"/>
    </g>
  </g>

  <!-- CONNECTOR · x 806 -->
  <g transform="translate(806,426)">
    <text x="2" y="-10" class="cardlbl">CONNECTOR</text>
    <use href="#builderShell"/>
    <g transform="translate(130,24)">
      <rect x="0" y="0" width="46" height="6" rx="1.5" fill="#0a0a0a"/>
      <rect x="0" y="12" width="196" height="3" rx="1.5" fill="#c0c0c0"/>
      <!-- connector: selectable system tiles -->
      <g transform="translate(0,24)">
        <rect x="0"  y="0"  width="94" height="26" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <circle cx="12" cy="13" r="4" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <rect x="24" y="11" width="40" height="4" rx="2" fill="#c0c0c0"/>
        <rect x="102" y="0" width="94" height="26" rx="3" fill="#0a0a0a"/>
        <circle cx="114" cy="13" r="4" fill="none" stroke="#ffffff" stroke-width="0.8"/>
        <rect x="126" y="11" width="40" height="4" rx="2" fill="#8a8a8a"/>
        <rect x="0"  y="32" width="94" height="26" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <circle cx="12" cy="45" r="4" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <rect x="24" y="43" width="30" height="4" rx="2" fill="#c0c0c0"/>
        <rect x="102" y="32" width="94" height="26" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <circle cx="114" cy="45" r="4" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
        <rect x="126" y="43" width="36" height="4" rx="2" fill="#c0c0c0"/>
      </g>
      <rect x="0" y="92" width="140" height="3" rx="1.5" fill="#c0c0c0"/>
      <rect x="0" y="99" width="104" height="3" rx="1.5" fill="#c0c0c0"/>
    </g>
  </g>

  <text x="600" y="614" text-anchor="middle" class="foot">The left pane never changes. Only what's being authored on the right does — that repetition is the message.</text>
</svg>
