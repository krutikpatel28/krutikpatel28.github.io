<svg width="920" height="460" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="920" height="460" rx="18" fill="#f7f7f5"/>

  <text x="460" y="50" text-anchor="middle" font-size="11" letter-spacing="2.5" fill="#6b6b6b" font-weight="600">5.5 — BUILD-TIME HONESTY</text>
  <text x="460" y="86" text-anchor="middle" font-size="24" font-weight="800" fill="#0a0a0a">Surface every gap during construction.</text>

  <!-- LEFT: warning state -->
  <g transform="translate(80,144)">
    <text x="160" y="0" text-anchor="middle" font-size="10" letter-spacing="2" fill="#6b6b6b" font-weight="600">DURING BUILD</text>

    <!-- warning card with hatched amber-like fill (we use diagonal pattern for amber in monochrome) -->
    <defs>
      <pattern id="amberHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#0a0a0a" stroke-width="0.4"/>
      </pattern>
    </defs>

    <rect x="0" y="24" width="320" height="170" rx="10" fill="url(#amberHatch)" stroke="#0a0a0a" stroke-width="1.5"/>
    <rect x="0" y="24" width="320" height="170" rx="10" fill="#ffffff" opacity="0.86"/>
    <rect x="0" y="24" width="320" height="170" rx="10" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>

    <!-- warning triangle icon -->
    <g transform="translate(20,46)">
      <polygon points="10,0 20,18 0,18" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round"/>
      <line x1="10" y1="7" x2="10" y2="12" stroke="#0a0a0a" stroke-width="1.5"/>
      <circle cx="10" cy="15" r="1" fill="#0a0a0a"/>
    </g>

    <text x="48" y="58" font-size="13" font-weight="700" fill="#0a0a0a">Additional details needed</text>
    <text x="20" y="84" font-size="11" fill="#0a0a0a" font-style="italic">I need you to add a data source</text>
    <text x="20" y="100" font-size="11" fill="#0a0a0a" font-style="italic">to your workflow.</text>

    <!-- tag pill -->
    <rect x="20" y="118" width="160" height="22" rx="11" fill="#ffffff" stroke="#0a0a0a" stroke-width="0.8"/>
    <circle cx="32" cy="129" r="3" fill="#0a0a0a"/>
    <text x="42" y="133" font-size="10" fill="#0a0a0a">Data from External Sources</text>

    <!-- Configure CTA -->
    <rect x="20" y="152" width="92" height="28" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <text x="66" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">Configure</text>

    <!-- hand pointer icon -->
    <g transform="translate(122,162)">
      <path d="M 4 0 V 8 M 4 8 H 1 Q 0 8 0 9 V 13 Q 0 16 4 16 H 12 Q 16 16 16 12 V 5 Q 16 4 15 4 Q 14 4 14 5 V 8 M 14 8 V 4 Q 14 3 13 3 Q 12 3 12 4 V 8 M 12 8 V 3 Q 12 2 11 2 Q 10 2 10 3 V 8 M 10 8 V 2 Q 10 1 9 1 Q 8 1 8 2 V 0 Q 8 -1 7 -1 Q 6 -1 6 0 V 8" fill="none" stroke="#0a0a0a" stroke-width="0.8"/>
    </g>
  </g>

  <!-- middle arrow -->
  <g transform="translate(414,228)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#0a0a0a" stroke-width="1.5"/>
    <polygon points="100,0 92,-5 92,5" fill="#0a0a0a"/>
    <text x="50" y="-12" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#0a0a0a" font-weight="600">RESOLVED</text>
    <text x="50" y="22" text-anchor="middle" font-size="9" fill="#6b6b6b" font-style="italic">at build, not runtime</text>
  </g>

  <!-- RIGHT: success state -->
  <g transform="translate(520,144)">
    <text x="160" y="0" text-anchor="middle" font-size="10" letter-spacing="2" fill="#6b6b6b" font-weight="600">BEFORE PUBLISH</text>

    <rect x="0" y="24" width="320" height="170" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <!-- pulled corner / ribbon to indicate "done" -->
    <polygon points="298,28 318,28 318,48" fill="#0a0a0a"/>

    <!-- check circle icon -->
    <g transform="translate(20,46)" fill="none" stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="10" cy="10" r="9.2" stroke-width="1.5"/>
      <path d="M 5.5 10 L 9 13.5 L 15 6.5" stroke-width="1.6"/>
    </g>

    <text x="48" y="62" font-size="13" font-weight="700" fill="#0a0a0a">Additional details added</text>
    <text x="20" y="92" font-size="11" fill="#0a0a0a">Connector wired up.</text>
    <text x="20" y="108" font-size="11" fill="#0a0a0a">Credentials valid.</text>
    <text x="20" y="124" font-size="11" fill="#0a0a0a">Schema confirmed.</text>

    <rect x="20" y="142" width="220" height="22" rx="11" fill="#0a0a0a"/>
    <circle cx="32" cy="153" r="3" fill="#ffffff"/>
    <text x="42" y="157" font-size="10" fill="#ffffff">Data from External Sources</text>

    <!-- check-pass label -->
    <text x="20" y="180" font-size="9" letter-spacing="1.5" fill="#6b6b6b" font-weight="600">READY TO PUBLISH</text>
  </g>

  <text x="460" y="424" text-anchor="middle" font-size="11" font-style="italic" fill="#6b6b6b">The agent cannot ship until the system has called its bluffs.</text>
</svg>
