<svg width="1080" height="660" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="Inter, system-ui, sans-serif">
  <style>
    .eyebrow { font-size: 11px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 600; }
    .title   { font-size: 32px;   font-weight: 800; fill: #0a0a0a; letter-spacing: -0.5px; }
    .sub     { font-size: 14px;   fill: #6b6b6b; }
    .num     { font-size: 10px;   letter-spacing: 0.18em; fill: #c0c0c0; font-weight: 700; }
    .pname   { font-size: 20px;   font-weight: 800; fill: #0a0a0a; letter-spacing: -0.2px; }
    .pdesc   { font-size: 11.5px; fill: #6b6b6b; }
    .pwho    { font-size: 9px;    letter-spacing: 0.14em; fill: #8a8a8a; font-weight: 700; }
    .foot    { font-size: 11px;   fill: #6b6b6b; font-style: italic; }
  </style>

  <rect x="0" y="0" width="1080" height="660" rx="18" fill="#f2f2ef"/>

  <!-- HEADER -->
  <text x="540" y="56"  text-anchor="middle" class="eyebrow">THE SIX PRIMITIVES</text>
  <text x="540" y="102" text-anchor="middle" class="title">One taxonomy. Six pieces.</text>
  <text x="540" y="132" text-anchor="middle" class="sub">Every primitive gets its own catalogue — and its own two-speed builder.</text>

  <!-- ROW 1 · cards at x 58 / 390 / 722 · w 300 · y 176 -->

  <!-- 01 Agent -->
  <g>
    <rect x="58" y="176" width="300" height="138" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(80,198)" fill="none" stroke="#0a0a0a" stroke-width="1.5">
      <rect x="2" y="2" width="20" height="18" rx="4"/>
      <circle cx="9"  cy="10" r="1.7" stroke-width="1.2"/>
      <circle cx="16" cy="10" r="1.7" stroke-width="1.2"/>
      <line x1="9" y1="16" x2="16" y2="16" stroke-width="1.3"/>
      <line x1="12" y1="-2" x2="12" y2="2" stroke-width="1.3"/>
    </g>
    <text x="336" y="212" text-anchor="end" class="num">01</text>
    <text x="80" y="258" class="pname">Agent</text>
    <text x="80" y="280" class="pdesc">An AI assistant that performs a task.</text>
    <text x="80" y="300" class="pwho">AUTHORED BY · WORKFLOW OWNER</text>
  </g>

  <!-- 02 Skill -->
  <g>
    <rect x="390" y="176" width="300" height="138" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(412,198)" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="14,0 5,12 11,12 9,22 18,9 12,9"/>
    </g>
    <text x="668" y="212" text-anchor="end" class="num">02</text>
    <text x="412" y="258" class="pname">Skill</text>
    <text x="412" y="280" class="pdesc">A specific action an agent can do.</text>
    <text x="412" y="300" class="pwho">AUTHORED BY · EITHER</text>
  </g>

  <!-- 03 Tool -->
  <g>
    <rect x="722" y="176" width="300" height="138" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(744,198)" fill="none" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="7,2 0,11 7,20"/>
      <polyline points="17,2 24,11 17,20"/>
    </g>
    <text x="1000" y="212" text-anchor="end" class="num">03</text>
    <text x="744" y="258" class="pname">Tool</text>
    <text x="744" y="280" class="pdesc">A capability an agent lacks natively.</text>
    <text x="744" y="300" class="pwho">AUTHORED BY · ENGINEERING</text>
  </g>

  <!-- ROW 2 · y 334 -->

  <!-- 04 Knowledge -->
  <g>
    <rect x="58" y="334" width="300" height="138" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(80,356)" fill="none" stroke="#0a0a0a" stroke-width="1.5">
      <path d="M 1 3 V 21 Q 1 23 3 23 H 22 V 3 Q 22 1 20 1 H 12 V 23"/>
      <line x1="5" y1="8"  x2="9" y2="8"  stroke-width="1.2"/>
      <line x1="5" y1="12" x2="9" y2="12" stroke-width="1.2"/>
    </g>
    <text x="336" y="370" text-anchor="end" class="num">04</text>
    <text x="80" y="416" class="pname">Knowledge</text>
    <text x="80" y="438" class="pdesc">Background information for grounding.</text>
    <text x="80" y="458" class="pwho">AUTHORED BY · EITHER</text>
  </g>

  <!-- 05 Connector -->
  <g>
    <rect x="390" y="334" width="300" height="138" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(412,356)" fill="none" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round">
      <path d="M 1 5 H 6 V 2"/>
      <path d="M 1 19 H 6 V 22"/>
      <rect x="6" y="6" width="10" height="12" rx="1.5"/>
      <line x1="16" y1="12" x2="23" y2="12"/>
    </g>
    <text x="668" y="370" text-anchor="end" class="num">05</text>
    <text x="412" y="416" class="pname">Connector</text>
    <text x="412" y="438" class="pdesc">An integration to an external system.</text>
    <text x="412" y="458" class="pwho">AUTHORED BY · ENGINEERING</text>
  </g>

  <!-- 06 Widget -->
  <g>
    <rect x="722" y="334" width="300" height="138" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.2"/>
    <g transform="translate(744,356)" fill="none" stroke="#0a0a0a" stroke-width="1.5">
      <rect x="0.5"  y="13" width="5" height="9"  rx="1"/>
      <rect x="8.5"  y="7"  width="5" height="15" rx="1"/>
      <rect x="16.5" y="2"  width="5" height="20" rx="1"/>
    </g>
    <text x="1000" y="370" text-anchor="end" class="num">06</text>
    <text x="744" y="416" class="pname">Widget</text>
    <text x="744" y="438" class="pdesc">A visual output component.</text>
    <text x="744" y="458" class="pwho">AUTHORED BY · EITHER</text>
  </g>

  <!-- COLLECTOR BRACKET · embraces the whole grid, no lines crossing cards -->
  <path d="M 58 504 V 528 Q 58 540 70 540 H 1010 Q 1022 540 1022 528 V 504"
        fill="none" stroke="#0a0a0a" stroke-width="1.3"/>
  <line x1="540" y1="540" x2="540" y2="562" stroke="#0a0a0a" stroke-width="1.3"/>
  <circle cx="540" cy="540" r="3.2" fill="#0a0a0a"/>

  <!-- Workflow pill -->
  <rect x="440" y="562" width="200" height="44" rx="22" fill="#0a0a0a"/>
  <text x="540" y="590" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.3">Workflow</text>

  <text x="540" y="640" text-anchor="middle" class="foot">Add a new primitive and the platform absorbs it — no new builder paradigm required.</text>
</svg>
