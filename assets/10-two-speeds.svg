<svg width="1080" height="660" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="DM Sans, Inter, system-ui, sans-serif">
  <style>
    .eyebrow  { font-size: 11px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 700; }
    .title    { font-size: 32px;   font-weight: 700; fill: #0a0a0a; letter-spacing: -0.5px; }
    .sub      { font-size: 14px;   fill: #6b6b6b; }
    .aud      { font-size: 10.5px; letter-spacing: 0.18em; fill: #0a0a0a; font-weight: 700; }
    .audsub   { font-size: 10px;   fill: #6b6b6b; }
    .modenum  { font-size: 9.5px;  letter-spacing: 0.2em; fill: #8a8a8a; font-weight: 700; }
    .modename { font-size: 21px;   font-weight: 700; fill: #0a0a0a; letter-spacing: -0.2px; }
    .cap      { font-size: 12px;   font-weight: 700; fill: #0a0a0a; }
    .capsub   { font-size: 10.5px; fill: #6b6b6b; }
    .tiny     { font-size: 6.5px;  letter-spacing: 0.12em; fill: #8a8a8a; font-weight: 700; }
    .chip     { font-size: 5.5px;  font-weight: 700; }
    .foot     { font-size: 11px;   fill: #6b6b6b; font-style: italic; }
  </style>

  <rect x="0" y="0" width="1080" height="660" rx="18" fill="#f2f2ef"/>

  <!-- HEADER -->
  <text x="540" y="54"  text-anchor="middle" class="eyebrow">THE TWO-SPEED BUILDER</text>
  <text x="540" y="100" text-anchor="middle" class="title">Same artifact. Two minds.</text>
  <text x="540" y="130" text-anchor="middle" class="sub">One product with two reading levels — and a shared gate before anything ships.</text>

  <!-- ============ AUDIENCE BAND (horizontal, above each card) ============ -->
  <text x="195" y="180" text-anchor="middle" class="aud">DOMAIN AUTHORS</text>
  <text x="195" y="197" text-anchor="middle" class="audsub">category mgrs · sourcing leads · analysts</text>

  <text x="540" y="180" text-anchor="middle" class="aud">ENGINEERS</text>
  <text x="540" y="197" text-anchor="middle" class="audsub">platform · ML · integration</text>

  <text x="885" y="180" text-anchor="middle" class="aud">BOTH, TOGETHER</text>
  <text x="885" y="197" text-anchor="middle" class="audsub">the gate before publish</text>

  <!-- audience arrows down into each card -->
  <g stroke="#0a0a0a" stroke-width="1.1" fill="#0a0a0a">
    <line x1="195" y1="208" x2="195" y2="226" stroke-dasharray="3 3"/>
    <polygon points="195,234 190,225 200,225" stroke="none"/>
    <line x1="540" y1="208" x2="540" y2="226" stroke-dasharray="3 3"/>
    <polygon points="540,234 535,225 545,225" stroke="none"/>
    <line x1="885" y1="208" x2="885" y2="226" stroke-dasharray="3 3"/>
    <polygon points="885,234 880,225 890,225" stroke="none"/>
  </g>

  <!-- ============ MODE 01 · SPECIFICATIONS · x45 ============ -->
  <g>
    <rect x="45" y="242" width="300" height="264" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="195" y="274" text-anchor="middle" class="modenum">MODE 01</text>
    <text x="195" y="302" text-anchor="middle" class="modename">Specifications</text>

    <!-- mini UI: dual pane · 256×120 at (67,322) -->
    <g transform="translate(67,322)">
      <rect x="0" y="0" width="256" height="120" rx="6" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.8"/>
      <line x1="96" y1="0" x2="96" y2="120" stroke="#0a0a0a" stroke-width="0.8"/>
      <text x="8" y="14" class="tiny">CHAT</text>
      <rect x="8"  y="22" width="58" height="10" rx="3" fill="#ededed"/>
      <rect x="26" y="36" width="54" height="10" rx="3" fill="#0a0a0a"/>
      <rect x="8"  y="50" width="62" height="14" rx="3" fill="#ededed"/>
      <rect x="8"  y="68" width="40" height="10" rx="3" fill="#ededed"/>
      <rect x="8"  y="96" width="80" height="16" rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.7" stroke-dasharray="2 2"/>

      <text x="104" y="14" class="tiny">ARTIFACT</text>
      <rect x="104" y="22" width="40"  height="5"   rx="1.5" fill="#0a0a0a"/>
      <rect x="104" y="33" width="140" height="2.5" rx="1.2" fill="#c0c0c0"/>
      <rect x="104" y="39" width="124" height="2.5" rx="1.2" fill="#c0c0c0"/>
      <rect x="104" y="45" width="132" height="2.5" rx="1.2" fill="#c0c0c0"/>
      <rect x="104" y="56" width="32"  height="5"   rx="1.5" fill="#0a0a0a"/>
      <rect x="104" y="66" width="140" height="2.5" rx="1.2" fill="#c0c0c0"/>
      <rect x="104" y="72" width="118" height="2.5" rx="1.2" fill="#c0c0c0"/>
      <rect x="104" y="82" width="140" height="14"  rx="3" fill="none" stroke="#0a0a0a" stroke-width="0.7"/>
      <rect x="104" y="102" width="90" height="2.5" rx="1.2" fill="#c0c0c0"/>
      <rect x="104" y="108" width="110" height="2.5" rx="1.2" fill="#c0c0c0"/>
    </g>

    <text x="195" y="470" text-anchor="middle" class="cap">Conversational</text>
    <text x="195" y="488" text-anchor="middle" class="capsub">chat left · artifact right</text>
  </g>

  <!-- ============ MODE 02 · ADVANCED · x390 ============ -->
  <g>
    <rect x="390" y="242" width="300" height="264" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="540" y="274" text-anchor="middle" class="modenum">MODE 02</text>
    <text x="540" y="302" text-anchor="middle" class="modename">Advanced</text>

    <!-- mini UI: node canvas · 256×120 at (412,322) -->
    <g transform="translate(412,322)">
      <rect x="0" y="0" width="256" height="120" rx="6" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.8"/>
      <g fill="#dedede">
        <circle cx="16" cy="16" r="0.9"/><circle cx="48" cy="16" r="0.9"/><circle cx="80" cy="16" r="0.9"/><circle cx="112" cy="16" r="0.9"/><circle cx="144" cy="16" r="0.9"/><circle cx="176" cy="16" r="0.9"/><circle cx="208" cy="16" r="0.9"/><circle cx="240" cy="16" r="0.9"/>
        <circle cx="16" cy="40" r="0.9"/><circle cx="48" cy="40" r="0.9"/><circle cx="80" cy="40" r="0.9"/><circle cx="112" cy="40" r="0.9"/><circle cx="144" cy="40" r="0.9"/><circle cx="176" cy="40" r="0.9"/><circle cx="208" cy="40" r="0.9"/><circle cx="240" cy="40" r="0.9"/>
        <circle cx="16" cy="64" r="0.9"/><circle cx="48" cy="64" r="0.9"/><circle cx="80" cy="64" r="0.9"/><circle cx="112" cy="64" r="0.9"/><circle cx="144" cy="64" r="0.9"/><circle cx="176" cy="64" r="0.9"/><circle cx="208" cy="64" r="0.9"/><circle cx="240" cy="64" r="0.9"/>
        <circle cx="16" cy="88" r="0.9"/><circle cx="48" cy="88" r="0.9"/><circle cx="80" cy="88" r="0.9"/><circle cx="112" cy="88" r="0.9"/><circle cx="144" cy="88" r="0.9"/><circle cx="176" cy="88" r="0.9"/><circle cx="208" cy="88" r="0.9"/><circle cx="240" cy="88" r="0.9"/>
        <circle cx="16" cy="110" r="0.9"/><circle cx="48" cy="110" r="0.9"/><circle cx="80" cy="110" r="0.9"/><circle cx="112" cy="110" r="0.9"/><circle cx="144" cy="110" r="0.9"/><circle cx="176" cy="110" r="0.9"/><circle cx="208" cy="110" r="0.9"/><circle cx="240" cy="110" r="0.9"/>
      </g>
      <!-- wires -->
      <g stroke="#0a0a0a" stroke-width="0.9" fill="none">
        <path d="M 64 31 H 104 V 48"/>
        <path d="M 216 36 V 42 H 156 V 48"/>
        <path d="M 104 78 V 97 H 74"/>
        <path d="M 156 78 V 101 H 200"/>
      </g>
      <!-- nodes -->
      <rect x="16" y="20" width="48" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="22" y="26" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="22" y="33" width="28" height="2" rx="1" fill="#c0c0c0"/>

      <rect x="192" y="14" width="48" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="198" y="20" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="198" y="27" width="28" height="2" rx="1" fill="#c0c0c0"/>

      <rect x="84" y="48" width="92" height="30" rx="5" fill="#0a0a0a"/>
      <rect x="92" y="56" width="14" height="3" rx="1.5" fill="#ffffff"/>
      <rect x="92" y="63" width="60" height="2" rx="1" fill="#8a8a8a"/>
      <rect x="92" y="69" width="44" height="2" rx="1" fill="#8a8a8a"/>

      <rect x="26" y="86" width="48" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="32" y="92" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="32" y="99" width="28" height="2" rx="1" fill="#c0c0c0"/>

      <rect x="200" y="90" width="48" height="22" rx="4" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="206" y="96" width="10" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="206" y="103" width="28" height="2" rx="1" fill="#c0c0c0"/>
    </g>

    <text x="540" y="470" text-anchor="middle" class="cap">Visual canvas</text>
    <text x="540" y="488" text-anchor="middle" class="capsub">nodes · prompts · models</text>
  </g>

  <!-- ============ MODE 03 · TEST · x735 ============ -->
  <g>
    <rect x="735" y="242" width="300" height="264" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <text x="885" y="274" text-anchor="middle" class="modenum">MODE 03</text>
    <text x="885" y="302" text-anchor="middle" class="modename">Test</text>

    <!-- mini UI: test cases · 256×120 at (757,322) -->
    <g transform="translate(757,322)">
      <rect x="0" y="0" width="256" height="120" rx="6" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.8"/>
      <text x="8" y="14" class="tiny">TEST CASES</text>

      <g fill="none" stroke="#0a0a0a">
        <!-- row 1 · pass -->
        <circle cx="14" cy="30" r="4.6" stroke-width="1"/>
        <polyline points="11.6,30 13.6,32.2 16.8,27.8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- row 2 · pass -->
        <circle cx="14" cy="50" r="4.6" stroke-width="1"/>
        <polyline points="11.6,50 13.6,52.2 16.8,47.8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- row 3 · pass -->
        <circle cx="14" cy="70" r="4.6" stroke-width="1"/>
        <polyline points="11.6,70 13.6,72.2 16.8,67.8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- row 4 · queued -->
        <circle cx="14" cy="90" r="4.6" stroke-width="1"/>
        <!-- row 5 · empty -->
        <circle cx="14" cy="108" r="4.6" stroke-width="0.8" stroke-dasharray="1.6 1.6" stroke="#c0c0c0"/>
      </g>

      <!-- row labels -->
      <rect x="26" y="28"  width="112" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="26" y="48"  width="104" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="26" y="68"  width="120" height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="26" y="88"  width="96"  height="3" rx="1.5" fill="#0a0a0a"/>
      <rect x="26" y="106" width="86"  height="3" rx="1.5" fill="#c0c0c0"/>

      <!-- status chips -->
      <rect x="204" y="24" width="40" height="13" rx="6.5" fill="none" stroke="#0a0a0a" stroke-width="0.7"/>
      <text x="224" y="33" text-anchor="middle" class="chip" fill="#0a0a0a">PASS</text>
      <rect x="204" y="44" width="40" height="13" rx="6.5" fill="none" stroke="#0a0a0a" stroke-width="0.7"/>
      <text x="224" y="53" text-anchor="middle" class="chip" fill="#0a0a0a">PASS</text>
      <rect x="204" y="64" width="40" height="13" rx="6.5" fill="none" stroke="#0a0a0a" stroke-width="0.7"/>
      <text x="224" y="73" text-anchor="middle" class="chip" fill="#0a0a0a">PASS</text>
      <rect x="204" y="84" width="40" height="13" rx="6.5" fill="#0a0a0a"/>
      <text x="224" y="93" text-anchor="middle" class="chip" fill="#ffffff">RUN</text>
      <rect x="204" y="102" width="40" height="13" rx="6.5" fill="none" stroke="#c0c0c0" stroke-width="0.7" stroke-dasharray="1.6 1.6"/>
      <text x="224" y="111" text-anchor="middle" class="chip" fill="#c0c0c0">ADD</text>
    </g>

    <text x="885" y="470" text-anchor="middle" class="cap">QA gate</text>
    <text x="885" y="488" text-anchor="middle" class="capsub">auto-generated + manual</text>
  </g>

  <!-- ============ CONVERGENCE RAIL ============ -->
  <g stroke="#0a0a0a" stroke-width="1.3" fill="none">
    <line x1="195" y1="506" x2="195" y2="534"/>
    <line x1="540" y1="506" x2="540" y2="534"/>
    <line x1="885" y1="506" x2="885" y2="534"/>
    <line x1="195" y1="534" x2="885" y2="534"/>
    <line x1="540" y1="534" x2="540" y2="558"/>
  </g>
  <circle cx="540" cy="534" r="3.4" fill="#0a0a0a"/>

  <rect x="440" y="558" width="200" height="44" rx="22" fill="#0a0a0a"/>
  <text x="540" y="586" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff" letter-spacing="0.2">One data model.</text>

  <text x="540" y="636" text-anchor="middle" class="foot">Switching modes is a lens change, not a one-way migration — nothing is thrown away.</text>
</svg>
