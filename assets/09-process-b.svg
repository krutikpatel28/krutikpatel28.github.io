<svg width="1080" height="550" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 550" font-family="Inter, system-ui, sans-serif">
  <style>
    .eyebrow { font-size: 11px;   letter-spacing: 0.22em; fill: #6b6b6b; font-weight: 600; }
    .title   { font-size: 32px;   font-weight: 800; fill: #0a0a0a; letter-spacing: -0.5px; }
    .sub     { font-size: 14px;   fill: #6b6b6b; }
    .step    { font-size: 10px;   letter-spacing: 0.2em;  fill: #6b6b6b; font-weight: 700; }
    .ntitle  { font-size: 15px;   font-weight: 800; fill: #0a0a0a; letter-spacing: -0.1px; }
    .ndesc   { font-size: 11px;   fill: #6b6b6b; }
    .looplbl { font-size: 9.5px;  letter-spacing: 0.2em;  fill: #6b6b6b; font-weight: 700; }
    .foot    { font-size: 11px;   fill: #6b6b6b; font-style: italic; }
  </style>

  <rect x="0" y="0" width="1080" height="550" rx="18" fill="#f2f2ef"/>

  <!-- HEADER -->
  <text x="540" y="56"  text-anchor="middle" class="eyebrow">THE TWO-SIDED RESEARCH LOOP</text>
  <text x="540" y="102" text-anchor="middle" class="title">Watch one side. Interview the other.</text>
  <text x="540" y="132" text-anchor="middle" class="sub">The gap between the two is where the design work lives.</text>

  <!-- RETURN LOOP: routed outside all content -->
  <path d="M 944 248 H 1018 Q 1030 248 1030 260 V 440 Q 1030 452 1018 452 H 62 Q 50 452 50 440 V 260 Q 50 248 62 248 H 127"
        fill="none" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="3 4"/>
  <polygon points="136,248 126,243 126,253" fill="#0a0a0a"/>

  <!-- loop label, knocked out of the rail -->
  <rect x="392" y="442" width="296" height="20" fill="#f2f2ef"/>
  <text x="540" y="456" text-anchor="middle" class="looplbl">REPEAT PER SURFACE DECISION</text>

  <!-- connector arrows between circles (gap centers 300 · 540 · 780) -->
  <g stroke="#0a0a0a" stroke-width="1.3" fill="#0a0a0a">
    <line x1="270" y1="248" x2="322" y2="248"/><polygon points="330,248 321,243 321,253" stroke="none"/>
    <line x1="510" y1="248" x2="562" y2="248"/><polygon points="570,248 561,243 561,253" stroke="none"/>
    <line x1="750" y1="248" x2="802" y2="248"/><polygon points="810,248 801,243 801,253" stroke="none"/>
  </g>

  <!-- STEP 01 · Observe · center 180 -->
  <g>
    <text x="180" y="192" text-anchor="middle" class="step">01</text>
    <circle cx="180" cy="248" r="44" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <g transform="translate(168,236)" fill="none" stroke="#0a0a0a" stroke-width="1.6">
      <path d="M 1 12 Q 12 4 23 12 Q 12 20 1 12 Z"/>
      <circle cx="12" cy="12" r="2.8" stroke-width="1.4"/>
    </g>
    <text x="180" y="326" text-anchor="middle" class="ntitle">Observe</text>
    <text x="180" y="342" text-anchor="middle" class="ntitle">the authors</text>
    <text x="180" y="364" text-anchor="middle" class="ndesc">Procurement experts try to build</text>
    <text x="180" y="378" text-anchor="middle" class="ndesc">in the old tool. Watch them stall.</text>
  </g>

  <!-- STEP 02 · Interview · center 420 -->
  <g>
    <text x="420" y="192" text-anchor="middle" class="step">02</text>
    <circle cx="420" cy="248" r="44" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <g transform="translate(408,236)" fill="none" stroke="#0a0a0a" stroke-width="1.6">
      <path d="M 1 5 H 21 Q 23 5 23 7 V 15 Q 23 17 21 17 H 9 L 4 21 V 17 Q 1 17 1 15 V 7 Q 1 5 3 5 Z"/>
      <line x1="6" y1="9"  x2="18" y2="9"  stroke-width="1.2"/>
      <line x1="6" y1="13" x2="14" y2="13" stroke-width="1.2"/>
    </g>
    <text x="420" y="326" text-anchor="middle" class="ntitle">Interview</text>
    <text x="420" y="342" text-anchor="middle" class="ntitle">the builders</text>
    <text x="420" y="364" text-anchor="middle" class="ndesc">Engineers who shipped those</text>
    <text x="420" y="378" text-anchor="middle" class="ndesc">workflows. Where did time go?</text>
  </g>

  <!-- STEP 03 · Find the translation step · center 660 -->
  <g>
    <text x="660" y="192" text-anchor="middle" class="step">03</text>
    <circle cx="660" cy="248" r="44" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <g transform="translate(648,236)" fill="none" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round">
      <path d="M 2 5 L 22 19"/>
      <path d="M 22 5 L 2 19"/>
    </g>
    <text x="660" y="326" text-anchor="middle" class="ntitle">Find the</text>
    <text x="660" y="342" text-anchor="middle" class="ntitle">translation step</text>
    <text x="660" y="364" text-anchor="middle" class="ndesc">Every gap between what authors</text>
    <text x="660" y="378" text-anchor="middle" class="ndesc">mean and what builders do.</text>
  </g>

  <!-- STEP 04 · Prototype both surfaces · center 900 -->
  <g>
    <text x="900" y="192" text-anchor="middle" class="step">04</text>
    <circle cx="900" cy="248" r="44" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
    <g transform="translate(888,236)" fill="none" stroke="#0a0a0a" stroke-width="1.5">
      <rect x="0"  y="3"  width="15" height="11" rx="1.5"/>
      <rect x="9"  y="10" width="15" height="11" rx="1.5" fill="#f2f2ef"/>
    </g>
    <text x="900" y="326" text-anchor="middle" class="ntitle">Prototype</text>
    <text x="900" y="342" text-anchor="middle" class="ntitle">both surfaces</text>
    <text x="900" y="364" text-anchor="middle" class="ndesc">Domain expert must win in Spec.</text>
    <text x="900" y="378" text-anchor="middle" class="ndesc">Engineer must win in Advanced.</text>
  </g>

  <text x="540" y="512" text-anchor="middle" class="foot">The translation work itself turned out to be the product opportunity.</text>
</svg>
