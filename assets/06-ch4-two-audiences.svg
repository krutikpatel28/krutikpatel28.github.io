<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 920 460"><rect width="920" height="460" fill="#f7f7f5" rx="18"/><text x="460" y="50" fill="#6b6b6b" font-size="11" font-weight="600" letter-spacing="2.5" text-anchor="middle">TWO AUDIENCES. ONE PRODUCT.</text><defs><pattern id="a" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><path stroke="#6b6b6b" stroke-width=".4" d="M0 0v6"/></pattern><pattern id="b" width="6" height="6" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><path stroke="#6b6b6b" stroke-width=".4" d="M0 0v6"/></pattern></defs><g transform="translate(120 120)"><text x="100" fill="#6b6b6b" font-size="10" font-weight="600" letter-spacing="2" text-anchor="middle">BEFORE</text><text x="100" y="22" fill="#0a0a0a" font-size="14" font-weight="700" text-anchor="middle">Tiny overlap.</text><circle cx="70" cy="160" r="80" fill="url(#a)" stroke="#0a0a0a" stroke-width="1.5"/><circle cx="170" cy="160" r="80" fill="url(#b)" stroke="#0a0a0a" stroke-width="1.5"/><text x="42" y="148" fill="#0a0a0a" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">DOMAIN</text><text x="42" y="162" fill="#6b6b6b" font-size="9" text-anchor="middle">authors</text><text x="198" y="148" fill="#0a0a0a" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">ENGINEERS</text><text x="198" y="162" fill="#6b6b6b" font-size="9" text-anchor="middle">builders</text><path stroke="#0a0a0a" stroke-dasharray="2 2" stroke-width=".8" d="M120 160v120"/><text x="120" y="296" fill="#0a0a0a" font-size="9" font-weight="600" letter-spacing="1.5" text-anchor="middle">USABLE BY</text><text x="120" y="310" fill="#0a0a0a" font-size="9" font-weight="600" letter-spacing="1.5" text-anchor="middle">BOTH</text><text x="120" y="324" fill="#6b6b6b" font-size="9" text-anchor="middle">(translation tax)</text></g><g transform="translate(540 120)"><text x="100" fill="#6b6b6b" font-size="10" font